<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12203a" />
    <title>AutoBank — Post a Trade</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-title" id="bar-title">Post a trade</div>
      <div class="bar-step" id="bar-step"></div>
    </header>

    <main id="screen"></main>

    <footer class="bar bar-bottom" id="footer" hidden>
      <button class="btn btn-ghost" id="back" type="button">Back</button>
      <button class="btn btn-primary" id="next" type="button">Next</button>
    </footer>

    <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
