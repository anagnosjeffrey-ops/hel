# One-off maintenance: delete a branch.
#
# Deleting a branch over the git protocol and over the REST API are both
# refused in the environment this repository is maintained from, but an
# Actions runner has ordinary write access to the repository. This workflow
# exists so a leftover branch can be removed without anyone opening the
# GitHub web UI. It is removed again once it has done its job.

name: Delete a branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to delete (no refs/heads/ prefix)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to delete anything load-bearing
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          case "$BRANCH" in
            main|master|gh-pages|'')
              echo "Refusing to delete '$BRANCH'." >&2
              exit 1
              ;;
          esac
          echo "Will delete '$BRANCH'."

      - name: Delete it
        env:
          BRANCH: ${{ inputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
          echo "Deleted ${BRANCH}."
