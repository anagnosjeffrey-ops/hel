name: Deploy to GitHub Pages

# Publishes the app so it can be opened on a phone. The camera needs a secure
# context, which GitHub Pages provides over https.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
#
# This repository's default branch is not `main`, so the feature branch is
# listed explicitly: the app deploys as soon as it is pushed, with no merge
# needed first. Getting a working URL onto a phone should not be gated on a
# round trip through the GitHub web UI.

on:
  push:
    branches:
      - main
      - master
      - claude/code-initialization-cm7uqr
      - claude/slot-machine-accessibility-8bbpfn
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          cp -r index.html styles.css manifest.webmanifest sw.js src icons _site/
          cp README.md _site/

      # enablement: true lets the workflow switch Pages on by itself where it
      # has the rights to. The default workflow token usually does not, so the
      # very first activation is a one-time click by a repository admin (see
      # the README). Once Pages exists, this step just reads its settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
