name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install: the app and its unit tests are plain
      # ES modules on node's built-in test runner.
      - name: Run unit tests
        run: npm test

      - name: Check every source file parses
        run: |
          for f in src/*.js sw.js scripts/*.js scripts/*.mjs; do
            node --check "$f"
          done
