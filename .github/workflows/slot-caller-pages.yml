# Publishes the Slot Caller accessibility app (slot-caller/) to GitHub Pages.
#
# Slot Caller is a static browser app and lives in its own folder; it shares
# nothing with the AutoBank service at the repository root and does not build,
# lint or test alongside it. This workflow is the only thing that touches it.
#
# It runs from main because the github-pages environment only accepts
# deployments from the default branch.

name: Deploy Slot Caller to Pages

on:
  push:
    branches: [main]
    paths:
      - 'slot-caller/**'
      - '.github/workflows/slot-caller-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slot-caller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependencies to install: the app and its tests are plain ES modules
      # on node's built-in test runner.
      - run: npm test
      - name: Check every source file parses
        run: |
          for f in src/*.js sw.js scripts/*.js scripts/*.mjs; do
            node --check "$f"
          done

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          cd slot-caller
          cp -r index.html styles.css manifest.webmanifest sw.js src icons README.md ../_site/
          # Serve the files exactly as committed; no Jekyll pass.
          touch ../_site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
